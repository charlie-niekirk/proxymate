# cargo-nextest (R0). CI runs `cargo nextest run --workspace --profile ci`.
# Each test is its own process, so a hung test is killed instead of holding
# the job until its timeout.

[profile.default]
# A test is reported slow after 30 s and killed after 4 periods (2 min).
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.ci]
fail-fast = false
failure-output = "immediate-final"
slow-timeout = { period = "30s", terminate-after = 4 }
