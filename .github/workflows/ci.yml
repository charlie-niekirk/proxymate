name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: TypeScript bindings are up to date
        run: git diff --exit-code -- apps/desktop/ui/src/bindings.ts

  ui:
    name: ui
    runs-on: ubuntu-latest
    # The Playwright image pins the browsers and fonts, so the Linux pixel
    # baselines (e2e/__snapshots__/*-linux.png) are made and checked in the
    # same environment. Missing baselines are written and fail the run; they
    # come back in the playwright-report artifact to be committed.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      # Viewer rendering (pixel snapshots), preview safety and UI flows
      # against the mock backend.
      - name: Playwright
        run: npm run e2e -w @proxymate/ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/desktop/ui/playwright-report/
            apps/desktop/ui/test-results/
            apps/desktop/ui/e2e/__snapshots__/*-linux.png
          retention-days: 7
