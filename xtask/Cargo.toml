[package]
name = "xtask"
description = "Proxymate's build tooling (`cargo xtask`): the native macOS bundle, DMG and signed updater files (G15)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The updater key and signatures, in the format Tauri's bundler writes, so
# installed Tauri copies and the native updater verify them alike.
minisign = "0.10"
base64 = "0.22"
flate2.workspace = true
tar = "0.4"
plist = "1"
serde_json.workspace = true

[dev-dependencies]
minisign-verify = "0.3"
tempfile = "3"

[lints]
workspace = true
