[package]
name = "pm-theme"
description = "Proxymate's colour tokens, read from tokens.css at build time, with the contrast rules and the gpui-kit theme mapping"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The mapping onto gpui-kit's theme and the active-tokens global (the native app).
kit = ["dep:gpui-kit", "dep:serde_json"]

[dependencies]
gpui-kit = { workspace = true, optional = true }
# The editor's syntax colours, built as gpui-kit's highlight-theme JSON (G4).
serde_json = { workspace = true, optional = true }

[lints]
workspace = true
