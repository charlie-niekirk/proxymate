[package]
name = "pm-core"
description = "Headless Proxymate engine: proxy, TLS, flow store and views, rules, import/export. No Tauri dependency."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
pm-model.workspace = true
pm-platform.workspace = true
parking_lot.workspace = true
rayon.workspace = true
thiserror.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["fs"] }
hyper.workspace = true
hyper-util.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
bytes.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
postcard.workspace = true
moka.workspace = true
uuid.workspace = true
flate2.workspace = true
brotli.workspace = true
zstd.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rustls-platform-verifier.workspace = true
rustls-native-certs.workspace = true
rcgen.workspace = true
x509-parser.workspace = true
time.workspace = true
ring.workspace = true
gethostname.workspace = true
globset.workspace = true
serde_json.workspace = true
regex.workspace = true
arc-swap.workspace = true
dashmap.workspace = true
rusqlite.workspace = true
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
base64 = "0.23"
# Scripts (M14). Without `parallel`, `futures`, `loader` or `bindgen`: each
# runtime stays on its worker thread, and there is no module loader.
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"] }
url = "2"
# Protobuf and gRPC (M16): `.proto` files compile in Rust (no `protoc`).
prost = "0.14"
prost-types = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
protox = "0.10"
rmpv = "1.3"
ciborium = "0.2"
p12-keystore = "0.4"
tower-service = "0.3"

[dev-dependencies]
pm-testkit.workspace = true
criterion.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util", "process"] }
plist = "1.10"

[[bench]]
name = "ingest"
harness = false

[lints]
workspace = true
