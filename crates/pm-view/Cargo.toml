[package]
name = "pm-view"
description = "UI logic of the native app with no gpui and no engine internals: DSL autocomplete, copy formats, selection, keys, JSON documents, rewrite diffs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Local time for the Time column (already in gpui's tree; thread-safe,
# unlike `time`'s local offset).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
pm-model.workspace = true
serde.workspace = true
# JSON string escaping for `copy_formats::pairs_json`.
serde_json.workspace = true

[lints]
workspace = true
