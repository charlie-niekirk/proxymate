[package]
name = "pm-testkit"
description = "Test upstreams, test CA and synthetic flow generation for integration tests and benches"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
pm-core.workspace = true
pm-model.workspace = true
tokio = { workspace = true, features = ["signal"] }
hyper.workspace = true
hyper-util = { workspace = true, features = ["service", "server"] }
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
bytes.workspace = true
futures-util.workspace = true
tokio-tungstenite = { workspace = true, features = ["handshake"] }
flate2.workspace = true
brotli.workspace = true
zstd.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rcgen.workspace = true
serde.workspace = true
serde_json.workspace = true
# The gRPC upstream (M16). Generated from proto/shop.proto by protox, so no
# `protoc` is needed.
tonic = { version = "0.14", default-features = false, features = ["codegen", "gzip", "zstd"] }
tonic-prost = "0.14"
tonic-web = "0.14"
prost = "0.14"
prost-types = "0.14"
tower = { version = "0.5", default-features = false, features = ["util"] }
base64 = "0.23"

[dev-dependencies]
rmpv = "1.3"
ciborium = "0.2"

[build-dependencies]
tonic-prost-build = { version = "0.14", default-features = false }
protox = "0.10"

[lints]
workspace = true
