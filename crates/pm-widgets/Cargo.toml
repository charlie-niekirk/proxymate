[package]
name = "pm-widgets"
description = "Reusable gpui widgets for the native app: FlowGrid, pills, the coloured URL, key-value tables, hex and JSON views, code views"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The code editor's grammars for the body viewers (G4); XML uses HTML's.
gpui-kit = { workspace = true, features = [
    "tree-sitter-css",
    "tree-sitter-graphql",
    "tree-sitter-html",
    "tree-sitter-javascript",
] }
pm-model.workspace = true
pm-theme = { workspace = true, features = ["kit"] }
pm-view.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
