[package]
name = "pm-platform"
description = "OS integration traits and per-platform implementations (system proxy, trust store, app detection)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
security-framework-sys = "2.17"
core-foundation = "0.10"
plist = "1.10"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSData", "NSDictionary", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSWorkspace",
  "NSImage",
  "NSImageRep",
  "NSBitmapImageRep",
  "NSGraphicsContext",
  "objc2-core-graphics",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage"] }

[lints]
workspace = true
