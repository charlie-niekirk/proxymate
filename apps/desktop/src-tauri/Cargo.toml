[package]
name = "proxymate-desktop"
description = "Proxymate desktop app: thin Tauri adapters over the pm-core Engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "proxymate"

[[bin]]
name = "proxymate"
path = "src/main.rs"

[lib]
name = "proxymate_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
pm-core.workspace = true
pm-model.workspace = true
pm-mcp.workspace = true
pm-platform.workspace = true
serde.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri.workspace = true
tauri-specta.workspace = true
tauri-plugin-dialog = "2"
parking_lot.workspace = true
tokio = { workspace = true, features = ["signal"] }

[dev-dependencies]
pm-testkit.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy.workspace = true

[lints]
workspace = true
