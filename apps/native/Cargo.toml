[package]
name = "proxymate-native"
description = "Proxymate's native desktop app: gpui and gpui-kit over the pm-core Engine (the Native track, G0–G16)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "proxymate_native"
path = "src/lib.rs"

[[bin]]
name = "proxymate-native"
path = "src/main.rs"

# The shell rendered offscreen in both themes (Metal on macOS, WGPU on
# Linux, lavapipe in CI): pixels checked against the tokens, PNGs written
# to `target/native-snapshots`. G0 spike (c). Its own harness: gpui's
# renderer wants the main thread.
# Not in `cargo test`/nextest (its harness lists no tests): run it with
# `cargo test -p proxymate-native --test render`.
[[test]]
name = "render"
path = "tests/render.rs"
test = false
harness = false

[features]
# The dev remote (PROXYMATE_DEV_REMOTE=1) and window captures. It turns on
# gpui-kit's test support for element lookup (`click`) and offscreen frames.
dev-harness = ["gpui-kit/test-support", "dep:pm-testkit"]
# The G0 spike harness (`examples/spike_bench.rs`), with the tree-sitter
# grammars the body viewers will use (G4).
spikes = ["gpui-kit/test-support", "gpui-kit/tree-sitter-languages"]

[[example]]
name = "spike_bench"
required-features = ["spikes"]

[[example]]
name = "spike_native_view"
required-features = ["spikes"]

[dependencies]
async-channel = "2"
# Local time for Save Session's suggested name (already in pm-view).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gpui-kit.workspace = true
pm-app.workspace = true
pm-core.workspace = true
pm-mcp.workspace = true
pm-model.workspace = true
pm-platform.workspace = true
# `PROXYMATE_DEV_ZOO` (G4): the zoo upstream and its fixtures.
pm-testkit = { workspace = true, optional = true }
pm-theme = { workspace = true, features = ["kit"] }
pm-view.workspace = true
pm-widgets.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# The updater (G15): the feed over HTTPS (rustls with ring through
# `pm_mcp::install_crypto_provider`, the OS trust store), Tauri-format
# minisign signatures, and the `.app.tar.gz` it unpacks.
base64 = "0.22"
flate2.workspace = true
minisign-verify = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
semver = "1"
tar = "0.4"
tempfile = "3"
thiserror.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
# The body-viewer zoo's fixtures for the render snapshots (G4).
pm-testkit.workspace = true
# Signs test updates in the release's format (`cargo xtask bundle-macos`).
minisign = "0.10"
# The type of gpui's captures (already in its tree).
image = { version = "0.25", default-features = false }

# G0 spike (b) only: PDFKit in a child NSView (production code for it goes
# in pm-platform, G5).
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSGeometry"] }
raw-window-handle = "0.6"
objc2-pdf-kit = { version = "0.3", default-features = false, features = ["std", "PDFDocument", "PDFView", "objc2-app-kit"] }

[lints]
workspace = true
